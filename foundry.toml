[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
]
fs_permissions = [{ access = "read-write", path = "./" }]

# FFI enabled so test/differential/ShareMathDifferential.t.sol can shell out
# to assurance/bin/refmath-cli.mjs (zero-dep Node script) and compare its
# uint256 output against the Solidity result. That differential test is the
# only consumer; no other test in the suite uses vm.ffi. The repo is a closed
# system (no third-party test deps), so the FFI foot-gun surface is bounded.
ffi = true

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
# `fail_on_revert = true`: every handler call must succeed against live state.
# Handlers short-circuit (early `return`) on the same conditions the vault
# would revert on, so the fuzzer never silently absorbs a failed call as a
# "tried it" — coverage numbers reflect calls that actually mutated state.
runs = 500           # per local run (fast); override with --invariant-runs
depth = 100          # max calls per sequence
fail_on_revert = true
shrink_run_limit = 5000
call_override = false

[profile.ci]
# Used in GitHub Actions — more thorough.
[profile.ci.invariant]
runs = 2000
depth = 150
fail_on_revert = true
shrink_run_limit = 5000

[profile.deep]
# Run locally for maximum coverage before a release.
[profile.deep.invariant]
runs = 10000
depth = 200
fail_on_revert = true
shrink_run_limit = 5000

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
base_mainnet = "${BASE_MAINNET_RPC}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
