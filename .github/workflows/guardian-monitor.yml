# Free always-on hosting for the Guardian bot via a scheduled single-pass check.
#
# GitHub Actions is free on public repos, so this replaces a paid always-on host
# (Fly/Koyeb/Railway). Each run executes guardian/src/once.ts — one invariant
# check against the latest block, persisted to Supabase — then exits.
#
# Trade-off vs the daemon: cadence is ~5 min, not per-block ~2s. A triggered
# violation (attack()) surfaces on the next run, within minutes. GitHub ran the
# schedule below only every 3-4 hours, so Supabase pg_cron starts this workflow
# every 5 minutes via workflow_dispatch
# (supabase/migrations/0005_monitor_dispatch_cron.sql); the schedule is a fallback.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   (none for RPC: the run uses the public Base Sepolia RPC, see RPC_URL below)
#   DATABASE_URL         — replacement PostgreSQL connection URL (TLS required)
name: Guardian Monitor

# Restored (issue #47): DATABASE_URL points at the `guardian_monitor` role
# through the Supabase session pooler. The checkpoint was seeded at block
# 50920945; the vault has emitted no logs since deployment, so its user set is
# complete (docs/operations.md, "Restore the hosted demo").
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Never let a slow run overlap the next scheduled one.
concurrency:
  group: guardian-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22   # 22+ has a global WebSocket, which @supabase/supabase-js requires
      - name: Install bot dependencies
        working-directory: guardian
        run: npm ci
      - name: Single-pass invariant check
        working-directory: guardian
        env:
          # Base Sepolia makes a block every 0.2 s, so a 5-minute run must scan
          # ~1500 blocks. Alchemy's free tier allows 10-block getLogs; the public
          # RPC allows 200.
          RPC_URL: https://sepolia.base.org
          LOG_RANGE: '200'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The Supabase pooler's chain ends at Supabase's own root CA.
          NODE_EXTRA_CA_CERTS: certs/supabase-prod-ca-2021.crt
          VAULT_ADDRESS: '0xfF9D77D1EC64C212D0552aEf587fa12125f803AF'
          DEBT_ASSET: '0x5E4FFa88822890f52002195D6DD45205B29D20Eb'
          VAULT_DEPLOY_BLOCK: '42751398'
          CHAIN: base-sepolia
        run: npx tsx src/once.ts
