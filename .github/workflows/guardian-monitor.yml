# Free always-on hosting for the Guardian bot via a scheduled single-pass check.
#
# GitHub Actions is free on public repos, so this replaces a paid always-on host
# (Fly/Koyeb/Railway). Each run executes guardian/src/once.ts — one invariant
# check against the latest block, persisted to Supabase — then exits.
#
# Trade-off vs the daemon: cadence is ~5 min (GitHub may delay scheduled runs
# under load), not per-block ~2s. A triggered violation (attack()) surfaces on
# the next run, within minutes.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ALCHEMY_KEY           — Alchemy Base Sepolia API key
#   DATABASE_URL         — replacement PostgreSQL connection URL (TLS required)
name: Guardian Monitor

# RETIRED (issue #23): the schedule is removed because the Supabase project this
# job wrote to was deleted, so every scheduled run would fail. The hosted
# dashboard renders a recorded run instead (scripts/record-demo-run.sh). To run a
# live monitor again, set DATABASE_URL to a new project, bootstrap history, set the secrets
# and restore the trigger:
#   schedule:
#     - cron: '*/5 * * * *'
on:
  workflow_dispatch: {}     # manual runs only

permissions:
  contents: read

# Never let a slow run overlap the next scheduled one.
concurrency:
  group: guardian-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22   # 22+ has a global WebSocket, which @supabase/supabase-js requires
      - name: Install bot dependencies
        working-directory: guardian
        run: npm ci
      - name: Single-pass invariant check
        working-directory: guardian
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAULT_ADDRESS: '0xfF9D77D1EC64C212D0552aEf587fa12125f803AF'
          DEBT_ASSET: '0x5E4FFa88822890f52002195D6DD45205B29D20Eb'
          VAULT_DEPLOY_BLOCK: '42751398'
          CHAIN: base-sepolia
        run: npx tsx src/once.ts
