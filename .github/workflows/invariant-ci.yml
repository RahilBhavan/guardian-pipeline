name: Invariant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: stable

      - name: Install deps
        run: forge install

      - name: Build contracts
        run: forge build --sizes

  mirror-parity:
    # Gates "every fuzz-proven invariant has an exported off-chain port."
    # The script is text-only — no Foundry, no DB — so it runs as a small
    # standalone job in parallel with the heavy ones. Failure means a
    # property was added to the harness without a paired entry in
    # guardian/src/evaluator.ts (or vice versa).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run mirror parity check
        run: node guardian/scripts/parity-check.mjs

  invariant-fuzz:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: stable

      - name: Install deps
        run: forge install

      - name: Run invariant fuzz tests
        env:
          BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC }}
          FOUNDRY_PROFILE: ci
        run: |
          forge test --match-contract InvariantVault -vvv 2>&1 | tee invariant-results.txt
          # Fail the job if any invariant failed
          if grep -q "\[FAIL\]" invariant-results.txt; then
            echo "::error::Invariant violation detected"
            exit 1
          fi

      - name: Set up Node (for corpus-coverage parser)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '20'

      - name: Emit runs.json artifact (AMC input)
        # AMC consumes runs.json — never foundry.toml — so it reflects the
        # campaign this job actually ran. `runs`/`depth` are pinned to the
        # profile.ci.invariant values; if FOUNDRY_PROFILE changes here, those
        # constants must change with it so the artifact stays truthful.
        env:
          FOUNDRY_PROFILE: ci
        run: |
          forge test --match-contract InvariantVault --json > forge-invariant.json
          mkdir -p assurance/data
          node assurance/bin/forge-invariant-to-runs-json.mjs \
            forge-invariant.json ci 2000 150 assurance/data/runs.json
          cat assurance/data/runs.json

      - name: Upload runs.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invariant-runs-json
          path: assurance/data/runs.json

      - name: Corpus-coverage gate — no handler selector may starve
        # Parses the per-selector "Metrics" table emitted by `forge test -vvv`
        # and fails if any handler selector fired fewer than 100 times in the
        # CI profile (2000 runs * 150 depth = 300k calls, ~27k/selector avg).
        # Catches handler edits that silently inert a selector — the suite
        # still passes but a whole action class never enters the fuzz space.
        run: node assurance/bin/corpus-coverage.mjs invariant-results.txt --min-calls 100

      - name: Corpus-coverage self-test — starved fixture must trip the gate
        # Inverts the previous step: feeds a fixture where LiquidateHandler.
        # liquidate has 0 calls (intentionally-disabled selector) and asserts
        # the parser exits 1. Guards against the gate silently becoming a
        # no-op after a future parser refactor.
        run: |
          set +e
          node assurance/bin/corpus-coverage.mjs assurance/test/fixtures/forge-invariant-starved.txt --min-calls 100
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::Corpus-coverage self-test failed: expected exit 1 on starved fixture, got $rc"
            exit 1
          fi
          echo "Self-test OK: starved fixture correctly tripped the gate"

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invariant-results
          path: invariant-results.txt

  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      - name: Install deps
        run: forge install

      - name: Generate coverage report
        # Cap invariant iterations under coverage instrumentation — the unit
        # suite already drives src/Vault.sol to 100%, so heavy fuzzing here only
        # adds runtime. The invariant-fuzz job runs the full 2,000-run profile.
        env:
          # Coverage-budget only — these capped values DO NOT feed the
          # Assurance Score. AMC consumes runs.json emitted by the
          # invariant-fuzz job (2000 runs / 150 depth), never foundry.toml or
          # this job's environment. Changing these caps cannot move the score.
          FOUNDRY_INVARIANT_RUNS: 25
          FOUNDRY_INVARIANT_DEPTH: 50
        run: forge coverage --report lcov --report summary 2>&1 | tee coverage-summary.txt

      - name: Check minimum coverage
        run: |
          # Gate on the reviewed contract (src/Vault.sol) — enforce >= 85% lines.
          # The deploy script and test handlers are intentionally not gated.
          LINE_COV=$(grep 'src/Vault.sol' coverage-summary.txt | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Vault.sol line coverage: ${LINE_COV}%"
          if (( $(echo "$LINE_COV < 85" | bc -l) )); then
            echo "::error::Vault.sol line coverage ${LINE_COV}% is below the 85% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: lcov.info

  static-analysis:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      - name: Install deps
        run: forge install

      - name: Install Slither
        run: pip3 install slither-analyzer --break-system-packages

      - name: Run Slither
        run: |
          slither . --config-file slither.config.json --checklist 2>&1 | tee slither-report.md || true
          # Upload even if Slither finds issues (we want the report).

      - name: Install Aderyn
        run: cargo install aderyn 2>/dev/null || true

      - name: Run Aderyn
        run: |
          mkdir -p docs
          aderyn . --output docs/aderyn-report.md 2>&1 || true

      - name: Upload static analysis reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-analysis-reports
          path: |
            slither-report.md
            docs/aderyn-report.md

  assurance:
    # Feature layer: exploit-class replays, finding traceability, Assurance Score.
    # `invariant-fuzz` is a hard dependency — AMC reads the runs.json artifact
    # that job emits. `needs:` enforces sequencing; the `if:` below forces this
    # job to RUN (not skip) when invariant-fuzz fails or is skipped, so the
    # "Verify runs.json present" step can fail loudly with a clear error rather
    # than letting the gate disappear silently. AMC never falls back to
    # foundry.toml — if runs.json is absent, this job exits non-zero.
    needs: [build, invariant-fuzz]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Verify invariant-fuzz produced runs.json
        # Acceptance gate: when invariant-fuzz did not succeed, fail this job
        # immediately with "runs.json missing" — never proceed to gatherStatic
        # where a missing artifact would only cap Static Verification at 60.
        # We want a loud red ✗ on the assurance job itself, not a downstream
        # score degradation that a future env tweak could mask.
        run: |
          status="${{ needs.invariant-fuzz.result }}"
          if [ "$status" != "success" ]; then
            echo "::error::runs.json missing — invariant-fuzz status was '$status'. AMC requires the runs.json artifact from a successful invariant-fuzz run; foundry.toml is never consulted."
            exit 1
          fi
          echo "invariant-fuzz succeeded; proceeding to download runs.json"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: stable

      - name: Install deps
        run: forge install

      - name: Download runs.json from invariant-fuzz
        # The heavy fuzz campaign ran in the invariant-fuzz job; this step
        # places that artifact at assurance/data/runs.json where gatherStatic
        # expects it.
        # NOTE: pin to a SHA before merge — every other action in this file is
        # SHA-pinned. Using the `v4` tag here until the reviewer supplies one.
        uses: actions/download-artifact@v4
        with:
          name: invariant-runs-json
          path: assurance/data

      - name: Replay historical exploit classes
        # Fails the build if any exploit scenario regressed or was MISSED — an
        # attack that corrupted state with no invariant catching it.
        run: |
          forge test --match-path "test/exploit/*" -vvv 2>&1 | tee exploit-results.txt
          if grep -q "\[FAIL\]" exploit-results.txt; then
            echo "::error::An exploit replay regressed or was MISSED"
            exit 1
          fi

      - name: Generate exploit-replay catalogue
        run: forge script script/ExploitReplay.s.sol

      - name: Generate coverage summary
        # Capped fuzz budget — AMC reads ONLY the coverage percentages from
        # this step's output; the runs/depth values here are coverage-budget
        # only and do not contribute to scoring. The Static Verification
        # component is driven by runs.json from the invariant-fuzz job.
        env:
          FOUNDRY_INVARIANT_RUNS: 25
          FOUNDRY_INVARIANT_DEPTH: 50
        run: |
          forge coverage --report summary --no-match-coverage "(script|test)" 2>&1 \
            | tee assurance/data/coverage-summary.txt

      - name: Compute Assurance Score and enforce the gate
        working-directory: assurance
        # The Assurance Score is a pre-deployment metric — three components, all
        # computed from repository evidence (coverage, exploit replays, finding
        # traceability). Fails the build if the composite drops below 80.
        # `check` also writes TRACEABILITY_SUMMARY.md and verifies the README
        # block matches the resolver's tier counts (see next step for why
        # that matters).
        run: |
          npm ci
          npm run check -- --min-score 80

      - name: Verify README traceability sentence matches resolver
        working-directory: assurance
        # Hard gate: "every finding bound to ≥1 invariant + harness test +
        # monitor check" only stays literally true if the README sentence
        # that asserts so is regenerated from the resolver. `--check-readme`
        # exits 1 if the sentence drifts from `security-review/findings.json`.
        # Runs after the `check` step above so TRACEABILITY_SUMMARY.md is
        # already on disk for the artifact upload.
        run: npm run trace -- --check-readme

      - name: Upload assurance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assurance-report
          path: |
            assurance/data/assurance-report.json
            assurance/data/assurance-report.md
            assurance/data/exploit-replays.json
            assurance/data/TRACEABILITY_SUMMARY.md
            exploit-results.txt

  gas-snapshot:
    needs: invariant-fuzz
    runs-on: ubuntu-latest
    # Required so the "Comment gas diff on PR" step can post via
    # github.rest.issues.createComment — the default GITHUB_TOKEN only has
    # read-level access on pull_request events.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      - name: Install deps
        run: forge install

      - name: Run gas snapshot
        run: forge snapshot --check 2>&1 | tee gas-diff.txt || true

      - name: Comment gas diff on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('gas-diff.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Gas snapshot diff\n\`\`\`\n${diff}\n\`\`\``
            });
